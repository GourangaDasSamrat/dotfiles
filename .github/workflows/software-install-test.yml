name: Software Install Test

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/software-install-test.yml"
      - "scripts/lib/softwares.sh"
      - "scripts/utils/software_lists.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            slug: ubuntu
            image: ubuntu:latest
            docker_opts: ""
          - name: Fedora
            slug: fedora
            image: fedora:latest
            docker_opts: ""
          - name: Arch Linux
            slug: arch
            image: archlinux:latest
            # pacman's Landlock sandbox fails under Docker's default seccomp profile.
            docker_opts: "--security-opt seccomp=unconfined"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: docker pull "$IMAGE"

      - name: Run softwares.sh in ${{ matrix.image }}
        id: install
        env:
          IMAGE: ${{ matrix.image }}
          DOCKER_OPTS: ${{ matrix.docker_opts }}
        run: |
          # Without pipefail the exit status of `docker run | tee` is tee's (always 0),
          # so a failed install/verify would be reported as "success" and no issue opened.
          set -o pipefail
          mkdir -p ci-logs
          # The step summary is mounted outside /tmp on purpose: the file is owned by the
          # runner user, and the kernel's fs.protected_regular blocks even root from
          # appending to a file it does not own inside a sticky dir like /tmp
          # ("Permission denied").
          # shellcheck disable=SC2086
          docker run --rm $DOCKER_OPTS \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GITHUB_STEP_SUMMARY=/ci/step_summary.md \
            -v "$GITHUB_STEP_SUMMARY:/ci/step_summary.md" \
            -v "$PWD:/dotfiles" \
            -w /dotfiles \
            "$IMAGE" \
            bash -c '
              bash scripts/lib/softwares.sh
              install_status=$?

              bash .github/scripts/verify-software.sh
              verify_status=$?

              echo "install exit code: $install_status, verify exit code: $verify_status"
              [ "$install_status" -eq 0 ] && [ "$verify_status" -eq 0 ]
            ' 2>&1 | tee ci-logs/install.log

      - name: Write report
        if: always()
        env:
          OS_NAME: ${{ matrix.name }}
          SLUG: ${{ matrix.slug }}
          OUTCOME: ${{ steps.install.outcome }}
        run: |
          mkdir -p report ci-logs
          touch ci-logs/install.log
          missing=$(grep -E '^  MISSING  ' ci-logs/install.log | sed -E 's/^  MISSING  //' || true)
          jq -n \
            --arg name "$OS_NAME" \
            --arg outcome "$OUTCOME" \
            --arg missing "$missing" \
            --arg log "$(tail -n 60 ci-logs/install.log)" \
            '{name: $name, outcome: $outcome, missing: ($missing | split("\n") | map(select(length > 0))), log: $log}' \
            > "report/$SLUG.json"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.slug }}
          path: report/${{ matrix.slug }}.json
          retention-days: 1

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      NONINTERACTIVE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run softwares.sh
        id: install
        run: |
          set +e
          # Propagate the failure of the brace group through `| tee`.
          set -o pipefail
          mkdir -p ci-logs
          {
            bash scripts/lib/softwares.sh
            install_status=$?

            bash .github/scripts/verify-software.sh
            verify_status=$?

            echo "install exit code: $install_status, verify exit code: $verify_status"
            [ "$install_status" -eq 0 ] && [ "$verify_status" -eq 0 ]
          } 2>&1 | tee ci-logs/install.log

      - name: Write report
        if: always()
        env:
          OS_NAME: macOS
          SLUG: macos
          OUTCOME: ${{ steps.install.outcome }}
        run: |
          mkdir -p report ci-logs
          touch ci-logs/install.log
          missing=$(grep -E '^  MISSING  ' ci-logs/install.log | sed -E 's/^  MISSING  //' || true)
          jq -n \
            --arg name "$OS_NAME" \
            --arg outcome "$OUTCOME" \
            --arg missing "$missing" \
            --arg log "$(tail -n 60 ci-logs/install.log)" \
            '{name: $name, outcome: $outcome, missing: ($missing | split("\n") | map(select(length > 0))), log: $log}' \
            > "report/$SLUG.json"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-macos
          path: report/macos.json
          retention-days: 1

  # Opens one issue per failing OS (listing the packages that failed) and
  # closes it again once that OS passes on a later run.
  report:
    name: Open / close issues
    needs: [linux, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      # Must run before the download: checkout cleans untracked files, which
      # would delete the downloaded reports if it ran afterwards.
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: report-*
          path: report
          merge-multiple: true

      - name: Sync issues
        uses: actions/github-script@v7
        with:
          script: |
            const run = require("./.github/scripts/sync-install-issues.js");
            await run({ github, context, core });
