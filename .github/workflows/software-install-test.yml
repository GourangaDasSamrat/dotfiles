name: Software Install Test

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/software-install-test.yml"
      - ".github/actions/write-report/**"
      - ".github/scripts/install-and-verify.sh"
      - "scripts/lib/softwares.sh"
      - "scripts/utils/software_lists.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            slug: ubuntu
            image: ubuntu:latest
            docker_opts: ""
          - name: Fedora
            slug: fedora
            image: fedora:latest
            docker_opts: ""
          - name: Arch Linux
            slug: arch
            image: archlinux:latest
            # pacman's Landlock sandbox fails under Docker's default seccomp profile.
            docker_opts: "--security-opt seccomp=unconfined"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: docker pull "$IMAGE"

      - name: Run softwares.sh in ${{ matrix.image }}
        id: install
        env:
          IMAGE: ${{ matrix.image }}
          DOCKER_OPTS: ${{ matrix.docker_opts }}
        run: |
          # Without pipefail the exit status of `docker run | tee` is tee's (always 0),
          # so a failed install/verify would be reported as "success" and no issue opened.
          set -o pipefail
          mkdir -p ci-logs
          # The step summary is mounted outside /tmp on purpose: the file is owned by the
          # runner user, and the kernel's fs.protected_regular blocks even root from
          # appending to a file it does not own inside a sticky dir like /tmp
          # ("Permission denied").
          # shellcheck disable=SC2086
          docker run --rm $DOCKER_OPTS \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GITHUB_STEP_SUMMARY=/ci/step_summary.md \
            -v "$GITHUB_STEP_SUMMARY:/ci/step_summary.md" \
            -v "$PWD:/dotfiles" \
            -w /dotfiles \
            "$IMAGE" \
            bash .github/scripts/install-and-verify.sh 2>&1 | tee ci-logs/install.log

      - name: Write and upload report
        if: always()
        uses: ./.github/actions/write-report
        with:
          name: ${{ matrix.name }}
          slug: ${{ matrix.slug }}
          outcome: ${{ steps.install.outcome }}

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      NONINTERACTIVE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run softwares.sh
        id: install
        run: |
          # Without pipefail the exit status of `... | tee` is tee's (always 0).
          set -o pipefail
          mkdir -p ci-logs
          bash .github/scripts/install-and-verify.sh 2>&1 | tee ci-logs/install.log

      - name: Write and upload report
        if: always()
        uses: ./.github/actions/write-report
        with:
          name: macOS
          slug: macos
          outcome: ${{ steps.install.outcome }}

  termux:
    name: Termux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Official x86_64 Termux image, so the job runs natively on the runner.
      IMAGE: termux/termux-docker:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull ${{ env.IMAGE }}
        run: docker pull "$IMAGE"

      - name: Run softwares.sh in ${{ env.IMAGE }}
        id: install
        run: |
          # Same pipefail reasoning as the linux job: keep docker's exit status.
          set -o pipefail
          mkdir -p ci-logs
          # Unlike the linux images, the container does not run as root but as Termux's
          # unprivileged `system` user, which cannot append to the runner-owned step
          # summary unless the file is world-writable.
          chmod a+w "$GITHUB_STEP_SUMMARY"
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GITHUB_STEP_SUMMARY=/ci/step_summary.md \
            -v "$GITHUB_STEP_SUMMARY:/ci/step_summary.md" \
            -v "$PWD:/dotfiles" \
            -w /dotfiles \
            "$IMAGE" \
            bash -c '
              # firefox, code-oss, bruno, ... come from these two repos, the same
              # prerequisite docs/termux/native-desktop.md asks for before the installer.
              pkg update -y && pkg install -y x11-repo tur-repo

              bash .github/scripts/install-and-verify.sh
            ' 2>&1 | tee ci-logs/install.log

      - name: Write and upload report
        if: always()
        uses: ./.github/actions/write-report
        with:
          name: Termux
          slug: termux
          outcome: ${{ steps.install.outcome }}

  # Opens one issue per failing OS (listing the packages that failed) and
  # closes it again once that OS passes on a later run.
  report:
    name: Open / close issues
    needs: [linux, macos, termux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      # Must run before the download: checkout cleans untracked files, which
      # would delete the downloaded reports if it ran afterwards.
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: report-*
          path: report
          merge-multiple: true

      - name: Sync issues
        uses: actions/github-script@v7
        with:
          script: |
            const run = require("./.github/scripts/sync-install-issues.js");
            await run({ github, context, core });
