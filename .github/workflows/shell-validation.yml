name: Shell Script Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "scripts/**/*.sh"
      - "zsh/**/*.zsh"
      - ".github/workflows/shell-validation.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "scripts/**/*.sh"
      - "zsh/**/*.zsh"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    name: ShellCheck Linting
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on shell scripts
        id: shellcheck
        run: |
          # The report is kept for the issue step below. pipefail makes the step
          # fail when shellcheck finds something (tee's own status is always 0).
          set -o pipefail
          mapfile -t scripts < <(find scripts -type f -name "*.sh" | sort)
          shellcheck "${scripts[@]}" 2>&1 | tee shellcheck.log

      - name: Create issue on ShellCheck failure
        if: failure() && steps.shellcheck.outcome == 'failure' && github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { upsertIssue, workflowRunLink } = require('./.github/scripts/issue-sync.js');

            // GitHub rejects issue bodies longer than 65536 characters.
            const MAX_OUTPUT = 60000;
            let output = fs.readFileSync('shellcheck.log', 'utf8');
            if (output.length > MAX_OUTPUT) {
              output = output.slice(0, MAX_OUTPUT) + '\n... (truncated, see the workflow log for the full report)';
            }

            await upsertIssue({
              github,
              context,
              label: 'shellcheck-issue',
              labels: ['shellcheck-issue', 'shell-validation'],
              title: '[Shell Validation] ShellCheck Issues Found',
              body: `## ShellCheck Validation Failure\n\n\`\`\`\n${output}\n\`\`\`\n\n**Workflow Run:** ${workflowRunLink(context)}`,
            });

  bash-syntax-check:
    runs-on: ubuntu-latest
    name: Bash Syntax Validation
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check bash syntax
        id: bash-syntax
        run: |
          echo "Checking bash syntax for .sh files..."
          failed_files=""

          for script in $(find scripts -type f -name "*.sh"); do
            if ! bash -n "$script" 2>&1; then
              failed_files="$failed_files$script\n"
            fi
          done

          if [ -n "$failed_files" ]; then
            echo "FAILED_FILES<<EOF" >> $GITHUB_OUTPUT
            echo -e "$failed_files" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "All bash scripts passed syntax validation!"

      - name: Create issue on bash syntax check failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v9
        env:
          FAILED_FILES: ${{ steps.bash-syntax.outputs.FAILED_FILES }}
        with:
          script: |
            const { upsertIssue, workflowRunLink } = require('./.github/scripts/issue-sync.js');

            await upsertIssue({
              github,
              context,
              label: 'bash-syntax-error',
              labels: ['bash-syntax-error', 'shell-validation'],
              title: '[Shell Validation] Bash Syntax Error',
              body: `## Bash Syntax Validation Failure\n\n**Failed Files:**\n${process.env.FAILED_FILES}\n\nPlease fix the syntax errors in the files listed above.\n\n**Workflow Run:** ${workflowRunLink(context)}`,
            });

  zsh-syntax-check:
    runs-on: ubuntu-latest
    name: Zsh Syntax Validation
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check zsh syntax
        id: zsh-syntax
        run: |
          echo "Checking zsh syntax for .zsh files..."
          failed_files=""

          for script in $(find zsh -type f -name "*.zsh"); do
            if ! zsh -n "$script" 2>&1; then
              failed_files="$failed_files$script\n"
            fi
          done

          if [ -n "$failed_files" ]; then
            echo "FAILED_FILES<<EOF" >> $GITHUB_OUTPUT
            echo -e "$failed_files" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "All zsh scripts passed syntax validation!"

      - name: Create issue on zsh syntax check failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v9
        env:
          FAILED_FILES: ${{ steps.zsh-syntax.outputs.FAILED_FILES }}
        with:
          script: |
            const { upsertIssue, workflowRunLink } = require('./.github/scripts/issue-sync.js');

            await upsertIssue({
              github,
              context,
              label: 'zsh-syntax-error',
              labels: ['zsh-syntax-error', 'shell-validation'],
              title: '[Shell Validation] Zsh Syntax Error',
              body: `## Zsh Syntax Validation Failure\n\n**Failed Files:**\n${process.env.FAILED_FILES}\n\nPlease fix the syntax errors in the files listed above.\n\n**Workflow Run:** ${workflowRunLink(context)}`,
            });

  close-issues:
    runs-on: ubuntu-latest
    name: Close Issues on Success
    needs: [shellcheck, bash-syntax-check, zsh-syntax-check]
    if: success() && github.event_name == 'push'
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout issue helpers
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Close shell-validation issues
        uses: actions/github-script@v9
        with:
          script: |
            const { closeIssues, workflowRunLink } = require('./.github/scripts/issue-sync.js');

            await closeIssues({
              github,
              context,
              label: 'shell-validation',
              comment: `✅ All shell scripts passed validation! Closing this issue.\n\n**Workflow Run:** ${workflowRunLink(context)}`,
            });
