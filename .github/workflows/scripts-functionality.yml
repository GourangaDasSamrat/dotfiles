name: Scripts Functionality Check

on:
  push:
    branches: [main, develop]
    paths:
      - "scripts/**"
      - ".github/scripts/check-scripts.sh"
      - ".github/workflows/scripts-functionality.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "scripts/**"
      - ".github/scripts/check-scripts.sh"
      - ".github/workflows/scripts-functionality.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts-execution-check:
    runs-on: ubuntu-latest
    name: Scripts Execution Test
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Syntax, sourcing, package-list and COPR checks all live in one script so
      # they can be run locally too: bash .github/scripts/check-scripts.sh
      - name: Test scripts
        id: exec-test
        run: bash .github/scripts/check-scripts.sh

      - name: Create issue on execution failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v9
        env:
          FAILED_SCRIPTS: ${{ steps.exec-test.outputs.FAILED_SCRIPTS }}
        with:
          script: |
            const { upsertIssue, workflowRunLink } = require('./.github/scripts/issue-sync.js');

            await upsertIssue({
              github,
              context,
              label: 'scripts-execution-error',
              labels: ['scripts-execution-error', 'scripts-check'],
              title: '[Scripts] Execution Failure',
              body: `## Scripts Execution Test Failure\n\n**Failed checks:**\n${process.env.FAILED_SCRIPTS}\n\nReproduce locally with \`bash .github/scripts/check-scripts.sh\`.\n\n**Workflow Run:** ${workflowRunLink(context)}`,
            });

  close-issues:
    runs-on: ubuntu-latest
    name: Close Issues on Success
    needs: [scripts-execution-check]
    if: success() && github.event_name == 'push'
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout issue helpers
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Close scripts-check issues
        uses: actions/github-script@v9
        with:
          script: |
            const { closeIssues, workflowRunLink } = require('./.github/scripts/issue-sync.js');

            await closeIssues({
              github,
              context,
              label: 'scripts-check',
              comment: `✅ All scripts passed execution test! Closing this issue.\n\n**Workflow Run:** ${workflowRunLink(context)}`,
            });
