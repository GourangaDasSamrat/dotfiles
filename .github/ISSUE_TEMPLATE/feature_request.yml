name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 📝 Description

        Use this form to suggest a new feature or enhancement.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the feature you'd like to see.
      placeholder: Describe the feature request.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Explain the problem this feature would solve.
      placeholder: Describe the problem or limitation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like in detail.
      placeholder: Explain the solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Describe other options you considered.
  - type: checkboxes
    id: tools
    attributes:
      label: Related Tools or Configs
      options:
        - label: zsh
        - label: tmux
        - label: neovim
        - label: vscode
        - label: alacritty
        - label: git
        - label: gh
        - label: other
  - type: input
    id: other_tool
    attributes:
      label: Other Tool or Config
      description: Fill this in if you selected other above.
      placeholder: Describe the related tool or config.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues for similar requests
        - label: This feature aligns with the dotfiles project scope
        - label: I can provide context or examples for this request